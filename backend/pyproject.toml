[project]
name = "stunting-care-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "python-dotenv==1.0.1",
    "imbalanced-learn==0.12.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "joblib==1.4.2",
    "numpy==1.26.4",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-multipart==0.0.12",
    "pygrowup==0.8.2",
    "pydantic",
    "email-validator",
    "six",
    "setuptools",
]

[tool.uv.extra-build-dependencies]
pygrowup = ["six", "setuptools"]